services:
  menus:
    build: .
    image: menus:latest
    container_name: menus
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Zurich
      # Jeton d'accès : sans lui, l'instance est ouverte à qui peut l'atteindre.
      # Indispensable dès que l'app sort du réseau local.
      # MENUS_TOKEN: "un-jeton-long-et-aleatoire"
      # Onglet « Claude » de l'app (facultatif) :
      # ANTHROPIC_API_KEY: "sk-ant-..."
    volumes:
      # La base en clair : settings.json, ingredients.json, recipes.json, weeks/
      - ./data:/data
    # Sur TrueNAS, aligner sur le propriétaire du dataset monté :
    # user: "568:568"
