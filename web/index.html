<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e6b4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Menus">
  <title>Menus &amp; courses</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232e6b4a'/><path d='M9 7v8a3 3 0 0 0 2 2.8V25h2v-7.2A3 3 0 0 0 15 15V7h-1.5v6h-1V7h-1v6h-1V7zM20 7c-1.7 0-3 2.4-3 6 0 2 1 3.3 2 3.7V25h2v-8.3c1-.4 2-1.7 2-3.7 0-3.6-1.3-6-3-6z' fill='white'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="prev" class="icon-btn" aria-label="Semaine précédente">‹</button>
      <div class="period">
        <div class="period-title" id="period-title">Semaine</div>
        <div class="period-sub" id="period-sub">—</div>
      </div>
      <button id="next" class="icon-btn" aria-label="Semaine suivante">›</button>
      <button id="today" class="link-btn" hidden>Cette semaine</button>
    </div>
  </header>

  <main id="main">
    <section id="view-semaine" class="view" aria-label="Menus de la semaine"></section>
    <section id="view-courses" class="view" aria-label="Liste de courses" hidden></section>
    <section id="view-recettes" class="view" aria-label="Recettes" hidden></section>
    <section id="view-reglages" class="view" aria-label="Réglages" hidden></section>
    <p id="loading" class="loading">Chargement…</p>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#semaine" data-view="semaine"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Semaine</span></a>
    <a href="#courses" data-view="courses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2 11h10l2-8H7.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="16.5" cy="19.5" r="1.3"/></svg><span>Courses</span><b id="badge-courses" hidden></b></a>
    <a href="#recettes" data-view="recettes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h10.5a1.5 1.5 0 0 1 1.5 1.5v15.5H7.5A1.5 1.5 0 0 1 6 19z"/><path d="M6 17.5h12M9.5 8h5M9.5 11h5"/></svg><span>Recettes</span></a>
    <a href="#reglages" data-view="reglages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Réglages</span></a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
