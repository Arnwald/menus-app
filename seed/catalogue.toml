# Catalogue des ingrédients : rayon (r), unité de référence (u), placard (p).
# Les recettes doivent utiliser ces noms et ces unités pour que la liste
# de courses additionne correctement. Sel et poivre ne sont jamais listés.
#
# Rayons : fl fruits & légumes · bo boulangerie · vi viande & volaille
#          po poisson · ch frais/traiteur/charcuterie · la lait, crème, œufs
#          fr fromage · pa pâtes, riz, céréales · co conserves & sauces
#          ep huiles, épices, condiments · pd petit-déj, sucre, farine
#          in international · su surgelés · bs boissons · di divers

