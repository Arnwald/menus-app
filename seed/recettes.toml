# Base de départ, chargée au premier lancement quand data/recipes.json n'existe pas.
#
# Quantités pour UN adulte ; l'app multiplie par (adultes + enfants × facteur).
# Une ligne d'ingrédient s'écrit « nom quantité unité », le nom tel qu'il
# figure dans catalogue.toml. Sel et poivre ne sont jamais listés.
#
# meal     dinner | brunch          brunch_kind  sweet | savory | base
# protein  fish | poultry | meat | veggie | legumes
# starch   rice | pasta | potato | bread | couscous | quinoa | polenta | noodles | tortilla | gnocchi | none
# keeps    se réchauffe bien (candidat pour « restes le lendemain »)
# months   mois où le plat a du sens ; absent = toute l'année

# ─── Soupers rapides (≤ 35 min) ───────────────────────────────────────────

