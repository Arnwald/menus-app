# Pile à coller dans Dockge (Compose → nouvelle pile → coller → Déployer).
services:
  menus:
    image: ghcr.io/arnwald/menus-app:latest
    container_name: menus
    restart: unless-stopped
    ports:
      # À ADAPTER si 8098 est déjà pris sur le NAS.
      - 8098:8080
    environment:
      TZ: Europe/Zurich
      # À ADAPTER — obligatoire : sans jeton, quiconque atteint ce port
      # lit et modifie vos menus. Génère-le avec : openssl rand -hex 24
      MENUS_TOKEN: REMPLACE-MOI
    volumes:
      # Dataset TrueNAS qui contiendra la base en clair
      # (settings.json, ingredients.json, recipes.json, weeks/).
      - /mnt/Instances/configs/menus:/data
    # L'utilisateur « apps » de TrueNAS SCALE. Le dataset ci-dessus doit lui
    # appartenir. Commenter cette ligne pour tourner en root à la place.
    user: 568:568
networks: {}
